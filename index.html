<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מונה משקאות</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שתייה">
<meta name="theme-color" content="#0f0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f0b1a; --bg2:#1a1430; --card:#211a3a; --card2:#2a2148;
    --text:#f5f1ff; --muted:#a79fc4; --line:#3a3060;
    --accent:#ffb340; --danger:#ff5470;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{min-height:100dvh;
    background:radial-gradient(120% 60% at 50% -10%,#3a1f5c 0%,var(--bg) 60%) no-repeat,var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
  .edit-btn{padding:8px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-size:15px;font-weight:600}
  .edit-btn.on{background:var(--accent);color:#1a1000}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:20px;padding:14px 16px}
  .stat .num{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .stat .lbl{color:var(--muted);font-size:14px;margin-top:6px}
  .stat.cal .num{color:var(--accent)}
  .last{color:var(--muted);font-size:14px;text-align:center;margin:4px 0 16px;min-height:18px}

  .list{display:flex;flex-direction:column;gap:12px}
  .drink{position:relative;display:flex;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:24px;padding:12px;
    border-inline-start:6px solid var(--c)}
  .emoji{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
    font-size:26px;background:color-mix(in srgb,var(--c) 28%,transparent)}
  .info{flex:1;min-width:0}
  .name{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
    .ctrl{display:flex;align-items:center;gap:4px;flex:none}
  .count{min-width:34px;text-align:center;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
  .count.bump{animation:bump .25s ease}
  @keyframes bump{40%{transform:scale(1.35)}}
  .pm{width:56px;height:56px;border-radius:50%;font-size:34px;font-weight:700;line-height:1;display:grid;place-items:center}
  .plus{background:var(--c);color:#111;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent)}
  .minus{background:var(--card2);color:var(--muted);width:40px;height:40px;font-size:26px}
  .pm:active{transform:scale(.9)}
  .minus:disabled{opacity:.3}
  .del{display:none;position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 10px #0008}
  .editing .del{display:grid;place-items:center}
  .editing .ctrl{display:none}
  .editing .drink::after{content:"✎ לעריכה";color:var(--muted);font-size:13px;flex:none}
  .editing .drink{animation:wob .3s ease-in-out infinite alternate}
  @keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:17px;line-height:1.6}
  .empty .big{font-size:56px}

  .fab{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);
    height:64px;border-radius:22px;background:var(--accent);color:#1a1000;font-size:20px;font-weight:800;
    box-shadow:0 10px 30px #ffb34055;max-width:520px;margin:auto}
  .fab:active{transform:scale(.97)}
  .reset{display:block;margin:22px auto 0;color:var(--muted);font-size:14px;padding:10px 16px;
    border:1px solid var(--line);border-radius:999px}

  /* sheets */
  .backdrop{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.2s;cursor:pointer}
  .x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--muted);font-size:20px;display:grid;place-items:center}
  .backdrop.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-radius:28px 28px 0 0;
    padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:.25s ease;
    max-height:92dvh;overflow:auto;max-width:560px;margin:auto}
  .sheet.open{transform:none}
  .sheet h2{margin:0 0 14px;font-size:20px}
  .field{margin-bottom:14px}
  .field label,.lbl2{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=text],input[type=number]{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:18px;padding:0 14px;-webkit-user-select:text;user-select:text}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  .grid{display:flex;flex-wrap:wrap;gap:8px}
  .emo-opt{width:48px;height:48px;border-radius:14px;background:var(--card);font-size:26px;display:grid;place-items:center}
  .emo-opt.sel{outline:3px solid var(--accent)}
  .col-opt{width:40px;height:40px;border-radius:50%;background:var(--c)}
  .col-opt.sel{outline:3px solid #fff;outline-offset:2px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{padding:7px 11px;border-radius:999px;background:var(--card);font-size:13px;color:var(--muted)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);
    border-radius:14px;padding:12px 14px}
  .switch .t{font-size:16px}
  .switch .d{font-size:12px;color:var(--muted);margin-top:2px}
  .tog{flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
  .tog::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
  .tog.on{background:var(--accent)}
  .tog.on::after{right:23px}
  .row{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;height:54px;border-radius:16px;font-size:18px;font-weight:800}
  .btn.primary{background:var(--accent);color:#1a1000}
  .btn.ghost{background:var(--card);color:var(--muted)}
  .preview{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px;border-radius:18px;
    background:var(--card);border-inline-start:6px solid var(--c)}
  .preview .emoji{width:44px;height:44px;font-size:26px;border-radius:14px}

  /* amount picker */
  .amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .amt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 4px;text-align:center}
  .amt b{display:block;font-size:24px}
  .amt span{font-size:12px;color:var(--muted)}
  .amt.def{background:var(--c);color:#111;border-color:transparent}
  .amt.def span{color:#111b}
  .amt:active{transform:scale(.95)}
  .custom{display:flex;gap:10px}
  .custom input{flex:1}
  .custom .btn{flex:none;width:96px}

  .toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-150%);
    background:#000d;padding:10px 16px;border-radius:999px;font-size:15px;transition:.25s;z-index:9;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
  .toast button{color:var(--accent);font-weight:800;margin-inline-start:10px}
</style>
</head>
<body>
<header>
  <h1>🍻 מונה משקאות</h1>
  <button class="edit-btn" id="editBtn">עריכה</button>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">משקאות</div></div>
  <div class="stat cal"><div class="num" id="totalCal">0</div><div class="lbl">קלוריות</div></div>
</div>
<div class="last" id="last"></div>

<div class="list" id="list"></div>
<button class="reset" id="shareBtn" hidden>📋 העתק סיכום ל-MyFitnessPal</button>
<button class="reset" id="resetBtn" hidden>🌙 ערב חדש (איפוס כמויות)</button>

<button class="fab" id="addBtn">＋ משקה חדש</button>

<div class="backdrop" id="backdrop"></div>

<!-- create / edit drink -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="x" data-close aria-label="סגור">✕</button>
  <h2 id="sheetTitle">משקה חדש</h2>
  <div class="preview" id="preview"><div class="emoji" id="pvEmoji">🍺</div><div class="name" id="pvName">בירה</div></div>
  <div class="field">
    <label for="fName">שם</label>
    <input type="text" id="fName" placeholder="למשל: בירה, וודקה רד בול..." maxlength="30" enterkeyhint="next">
    <div class="presets" id="presets"></div>
  </div>
  <div class="field two">
    <div><label for="fSize">כמות ברירת מחדל (מ״ל)</label>
      <input type="number" id="fSize" inputmode="numeric" placeholder="330" min="1" max="5000"></div>
    <div><label for="fCal">קלוריות ל-100 מ״ל</label>
      <input type="number" id="fCal" inputmode="decimal" placeholder="43" min="0" max="1000" step="any"></div>
  </div>
  <div class="field">
    <button class="switch" type="button" id="fAsk" style="width:100%;text-align:start">
      <div><div class="t">לשאול כמות בכל הוספה</div><div class="d">מתאים לשוטים / כוסות לא קבועות. כבוי = ＋ מוסיף ישר את ברירת המחדל</div></div>
      <div class="tog" id="fAskTog"></div>
    </button>
  </div>
  <div class="field"><label>אימוג'י</label><div class="grid" id="emojis"></div></div>
  <div class="field"><label>צבע</label><div class="grid" id="colors"></div></div>
  <div class="row">
    <button class="btn ghost" id="cancelBtn">ביטול</button>
    <button class="btn primary" id="saveBtn">הוסף</button>
  </div>
</div>

<!-- amount picker -->
<div class="sheet" id="amtSheet" role="dialog" aria-modal="true">
  <button class="x" data-close aria-label="סגור">✕</button>
  <h2 id="amtTitle">כמה?</h2>
  <div class="amounts" id="amounts"></div>
  <span class="lbl2">כמות אחרת (מ״ל)</span>
  <div class="custom">
    <input type="number" id="amtCustom" inputmode="numeric" placeholder="מ״ל" min="1" max="5000">
    <button class="btn primary" id="amtAdd">הוסף</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'drinks-v2';
  const EMOJIS = ['🍺','🍻','🍷','🥂','🍾','🍸','🍹','🥃','🍶','🧉','🥤','🧃','💧','🔥','🍋','🫗'];
  const COLORS = ['#ffb340','#ff6b6b','#ff4fa3','#b46bff','#5b8cff','#36c9f2','#3ddc97','#c6f04a','#f5f1ff'];
  // cal = kcal per 100 ml, size = default ml
  const PRESETS = [
    {name:'בירה',emoji:'🍺',cal:43,size:500,ask:false,color:'#ffb340'},
    {name:'יין',emoji:'🍷',cal:85,size:150,ask:false,color:'#ff4fa3'},
    {name:'וודקה',emoji:'🥃',cal:231,size:40,ask:true,color:'#36c9f2'},
    {name:'וויסקי',emoji:'🥃',cal:250,size:40,ask:true,color:'#ff6b6b'},
    {name:'ערק',emoji:'🥃',cal:300,size:40,ask:true,color:'#f5f1ff'},
    {name:'קוקטייל',emoji:'🍹',cal:120,size:250,ask:false,color:'#3ddc97'},
    {name:'מים',emoji:'💧',cal:0,size:300,ask:false,color:'#5b8cff'},
  ];

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  let state = load() || { drinks: [], last: null };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const kcal = (ml, cal100) => Math.round(ml * cal100 / 100);
  const drinkCal = d => d.pours.reduce((a,p) => a + kcal(p.ml, d.cal), 0);
  const fmt = n => n.toLocaleString('he-IL');
  let editing = false;

  function fmtAgo(ts){
    const m = Math.floor((Date.now()-ts)/60000);
    if (m < 1) return 'ממש עכשיו';
    if (m < 60) return `לפני ${m} דק׳`;
    const h = Math.floor(m/60), r = m%60;
    return `לפני ${h} שע׳` + (r ? ` ו-${r} דק׳` : '');
  }

  function render(){
    const list = $('list');
    const total = state.drinks.reduce((a,d)=>a+d.pours.length,0);
    const cal = state.drinks.reduce((a,d)=>a+drinkCal(d),0);
    $('totalCount').textContent = total;
    $('totalCal').textContent = fmt(cal);
    $('last').textContent = state.last ? `🕒 אחרון: ${state.last.name} ${state.last.ml} מ״ל · ${fmtAgo(state.last.t)}` : '';
    $('resetBtn').hidden = total === 0 || editing;
    $('shareBtn').hidden = total === 0 || editing;
    document.body.classList.toggle('editing', editing);
    $('editBtn').classList.toggle('on', editing);
    $('editBtn').textContent = editing ? 'סיום' : 'עריכה';
    $('editBtn').hidden = state.drinks.length === 0 && !editing;

    if (!state.drinks.length){
      list.innerHTML = `<div class="empty"><div class="big">🥂</div>עוד אין משקאות.<br>לחץ על <b>＋ משקה חדש</b> למטה</div>`;
      return;
    }
    list.innerHTML = state.drinks.map(d => `
      <div class="drink" style="--c:${d.color}" data-id="${d.id}">
        <button class="del" data-act="del" aria-label="מחק">✕</button>
        <div class="emoji">${d.emoji}</div>
        <div class="info">
          <div class="name">${esc(d.name)}</div>
          <div class="sub">${d.ask ? 'כמות משתנה' : `${d.size} מ״ל · ${kcal(d.size,d.cal)} קל׳`}</div>
          <div class="sub">סה״כ ${fmt(drinkCal(d))} קל׳</div>
        </div>
        <div class="ctrl">
          <button class="pm minus" data-act="dec" aria-label="הורד" ${d.pours.length?'':'disabled'}>−</button>
          <div class="count" data-count>${d.pours.length}</div>
          <button class="pm plus" data-act="inc" aria-label="הוסף">+</button>
        </div>
      </div>`).join('');
  }

  let toastTimer;
  function toast(html, ms=2500){
    const t = $('toast'); t.innerHTML = html; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), ms);
    return t;
  }

  function addPour(d, ml){
    d.pours.push({ ml, t: Date.now() });
    state.last = { name: d.name, ml, t: Date.now() };
    save(); render();
    const c = document.querySelector(`.drink[data-id="${d.id}"] [data-count]`);
    c && c.classList.add('bump');
  }

  $('list').addEventListener('click', e => {
    const card = e.target.closest('.drink'); if (!card) return;
    const d = state.drinks.find(x => x.id === card.dataset.id); if (!d) return;
    const btn = e.target.closest('button[data-act]');
    if (editing){
      if (btn && btn.dataset.act === 'del'){
        const idx = state.drinks.indexOf(d);
        state.drinks.splice(idx,1); save(); render();
        const t = toast(`נמחק: ${esc(d.name)} <button>בטל</button>`, 4000);
        t.querySelector('button').onclick = () => { state.drinks.splice(idx,0,d); save(); render(); t.classList.remove('show'); };
      } else openSheet(d);
      return;
    }
    if (!btn) return;
    if (btn.dataset.act === 'inc'){ d.ask ? openAmount(d) : addPour(d, d.size); }
    else if (btn.dataset.act === 'dec' && d.pours.length){ d.pours.pop(); save(); render(); }
  });

  $('shareBtn').onclick = async () => {
    const used = state.drinks.filter(d => d.pours.length);
    const cal = used.reduce((a,d)=>a+drinkCal(d),0);
    const lines = used.map(d => {
      const ml = d.pours.reduce((a,p)=>a+p.ml,0);
      return `${d.name}: ${d.pours.length}× (${ml} מ״ל) – ${drinkCal(d)} קל׳`;
    });
    const text = [`סה״כ ${cal} קלוריות`, ...lines].join(String.fromCharCode(10));
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); toast(`הועתק! ${cal} קל׳ ← Quick Add`); }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      try { await navigator.clipboard.writeText(text); toast(`הועתק! ${cal} קל׳ ← Quick Add`); } catch { prompt('העתק:', text); }
    }
  };

  $('editBtn').onclick = () => { editing = !editing; render(); };

  $('resetBtn').onclick = () => {
    if (!confirm('לאפס את כל הכמויות לערב חדש? (סוגי המשקאות יישמרו)')) return;
    state.drinks.forEach(d => d.pours = []); state.last = null; save(); render();
  };

  // ---- sheets ----
  let openSheetEl = null;
  function show(el){ openSheetEl = el; el.classList.add('open'); $('backdrop').classList.add('open'); }
  function hide(){
    document.activeElement && document.activeElement.blur();
    openSheetEl && openSheetEl.classList.remove('open'); $('backdrop').classList.remove('open'); openSheetEl = null;
  }
  $('backdrop').addEventListener('click', hide);
  $('backdrop').addEventListener('touchend', e => { e.preventDefault(); hide(); });
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = hide);

  // amount picker
  let amtDrink = null;
  function amountOptions(size){
    const base = size <= 80 ? [20,30,40,50,60,100] : size <= 200 ? [100,150,200,250,330,500] : [250,330,400,500,650,1000];
    const set = new Set([size, ...base]);
    return [...set].sort((a,b)=>a-b).slice(0,6);
  }
  function openAmount(d){
    amtDrink = d;
    $('amtTitle').textContent = `${d.emoji} כמה ${d.name}?`;
    $('amtSheet').style.setProperty('--c', d.color);
    $('amounts').innerHTML = amountOptions(d.size).map(ml =>
      `<button class="amt ${ml===d.size?'def':''}" data-ml="${ml}"><b>${ml}</b><span>מ״ל · ${kcal(ml,d.cal)} קל׳</span></button>`).join('');
    $('amtCustom').value = '';
    show($('amtSheet'));
  }
  $('amounts').onclick = e => {
    const b = e.target.closest('.amt'); if (!b || !amtDrink) return;
    const d = amtDrink; hide(); addPour(d, +b.dataset.ml);
  };
  $('amtAdd').onclick = () => {
    const ml = parseInt($('amtCustom').value,10);
    if (!(ml > 0 && ml <= 5000)){ $('amtCustom').focus(); return; }
    const d = amtDrink; hide(); addPour(d, ml);
  };

  // create / edit
  let form = {}, editTarget = null;
  function paintForm(){
    $('pvEmoji').textContent = form.emoji;
    $('pvName').textContent = $('fName').value.trim() || 'משקה';
    $('preview').style.setProperty('--c', form.color);
    $('fAskTog').classList.toggle('on', form.ask);
    document.querySelectorAll('.emo-opt').forEach(b => b.classList.toggle('sel', b.textContent === form.emoji));
    document.querySelectorAll('.col-opt').forEach(b => b.classList.toggle('sel', b.dataset.c === form.color));
  }
  $('emojis').innerHTML = EMOJIS.map(e => `<button class="emo-opt" type="button">${e}</button>`).join('');
  $('colors').innerHTML = COLORS.map(c => `<button class="col-opt" type="button" data-c="${c}" style="--c:${c}" aria-label="צבע"></button>`).join('');
  $('presets').innerHTML = PRESETS.map((p,i) => `<button class="chip" type="button" data-i="${i}">${p.emoji} ${p.name}</button>`).join('');
  $('emojis').onclick = e => { const b = e.target.closest('.emo-opt'); if (b){ form.emoji = b.textContent; paintForm(); } };
  $('colors').onclick = e => { const b = e.target.closest('.col-opt'); if (b){ form.color = b.dataset.c; paintForm(); } };
  $('fAsk').onclick = () => { form.ask = !form.ask; paintForm(); };
  $('presets').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return; const p = PRESETS[b.dataset.i];
    $('fName').value = p.name; $('fCal').value = p.cal; $('fSize').value = p.size;
    Object.assign(form, { emoji:p.emoji, color:p.color, ask:p.ask }); paintForm();
  };
  $('fName').oninput = paintForm;
  $('fName').addEventListener('keydown', e => { if (e.key === 'Enter') $('fSize').focus(); });

  function openSheet(d){
    editTarget = d || null;
    $('presets').hidden = !!d;
    $('sheetTitle').textContent = d ? 'עריכת משקה' : 'משקה חדש';
    $('saveBtn').textContent = d ? 'שמור' : 'הוסף';
    form = d ? { emoji:d.emoji, color:d.color, ask:d.ask }
             : { emoji:'🍺', color: COLORS[state.drinks.length % COLORS.length], ask:false };
    $('fName').value = d ? d.name : '';
    $('fSize').value = d ? d.size : '';
    $('fCal').value = d ? d.cal : '';
    paintForm(); show($('sheet'));
  }
  $('addBtn').onclick = () => openSheet();
  $('cancelBtn').onclick = hide;
  $('saveBtn').onclick = () => {
    const name = $('fName').value.trim();
    if (!name){ $('fName').focus(); toast('צריך לתת שם למשקה'); return; }
    const size = parseInt($('fSize').value,10);
    if (!(size > 0 && size <= 5000)){ $('fSize').focus(); toast('צריך כמות ברירת מחדל במ״ל'); return; }
    const cal = Math.max(0, Math.min(1000, parseFloat($('fCal').value) || 0));
    const data = { name, size, cal, ask: form.ask, emoji: form.emoji, color: form.color };
    if (editTarget) Object.assign(editTarget, data);
    else { state.drinks.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), pours: [], ...data }); editing = false; }
    save(); render(); hide();
  };

  render();
  setInterval(() => { if (state.last && !openSheetEl) render(); }, 30000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
